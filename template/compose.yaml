services:
  web:
    build: ./web
    restart: unless-stopped
    init: true
    ports:
      - ${PORT_APP:-3000}:3000

  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    environment:
      - APP_URL=http://web:3000/
      - FLAG=Alpaca{REDACTED}
    ports:
      - ${PORT_BOT:-1337}:1337
